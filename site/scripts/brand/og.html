<!doctype html>
<!-- From the terminal-rs download page (github.com/michaelshimeles/terminal-rs, site/assets-src/og.html). -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				/* The capture fits its board into the part of the window this card shows. Keep CARD_SHOWS
				   in scripts/screenshots in step with these. */
				--shot-x: 560px;
				--shot-y: 92px;
				--pt: calc(900px / 1280);
				position: relative;
				background:
					radial-gradient(ellipse 560px 420px at 14% 18%, rgba(110, 155, 255, 0.1), transparent 70%),
					#0a0a0b;
				color: #f4f4f5;
				font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.copy {
				position: absolute;
				left: 72px;
				top: 72px;
				width: 400px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 30px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.brand img {
				width: 104px;
				height: 104px;
				margin: -12px -8px -12px -12px;
			}
			h1 {
				margin: 56px 0 20px;
				font-size: 56px;
				line-height: 1.04;
				font-weight: 700;
				letter-spacing: -0.035em;
				text-wrap: balance;
			}
			p {
				margin: 0;
				color: #8e8e93;
				font-size: 24px;
				line-height: 1.4;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				margin-top: 36px;
				padding: 14px 24px 14px 22px;
				border-radius: 999px;
				background: #f5f5f7;
				color: #000;
				font-size: 20px;
				font-weight: 600;
			}
			.pill svg {
				width: 17px;
				height: 21px;
			}
			.shot {
				position: absolute;
				left: var(--shot-x);
				top: var(--shot-y);
				width: calc(1280 * var(--pt));
				border-radius: 14px;
				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.1),
					0 30px 80px rgba(0, 0, 0, 0.6);
			}
			/* macOS draws these over the window, so the capture lacks them. The app insets them 14 pt
			   into its 40 pt toolbar. */
			.lights {
				position: absolute;
				left: calc(var(--shot-x) + 15 * var(--pt));
				top: calc(var(--shot-y) + 14 * var(--pt));
				display: flex;
				gap: calc(8 * var(--pt));
			}
			.lights i {
				width: calc(12 * var(--pt));
				height: calc(12 * var(--pt));
				border-radius: 50%;
				background: #ff5f57;
			}
			.lights i:nth-child(2) {
				background: #febc2e;
			}
			.lights i:nth-child(3) {
				background: #28c840;
			}
		</style>
	</head>
	<body>
		<div class="copy">
			<div class="brand"><img src="icon.svg" alt="" />Sketch</div>
			<h1>Sketch it, then design it.</h1>
			<p>A fast, native canvas for the Mac, written in Rust.</p>
			<div class="pill">
				<svg viewBox="0 0 17 21">
					<path
						d="M11.2 4.3c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3zM12.1 5.8c-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.9-.8C4.4 5.9 3 6.8 2.2 8.1c-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.8 2.3 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.4-.9-2.4-3.6 0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7z"
					/>
				</svg>
				Free for macOS
			</div>
		</div>
		<img class="shot" src="../screenshots/out/og.png" alt="" />
		<div class="lights"><i></i><i></i><i></i></div>
	</body>
</html>
