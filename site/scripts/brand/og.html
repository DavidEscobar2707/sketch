<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
	@font-face {
		font-family: 'Inter Variable';
		font-weight: 100 900;
		src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2) format('woff2-variations');
	}
	html, body { margin: 0; }
	body {
		width: 1200px;
		height: 630px;
		overflow: hidden;
		position: relative;
		background-color: #f4f4f6;
		background-image: radial-gradient(#d6d6de 1.3px, transparent 1.6px);
		background-size: 24px 24px;
		color: #1d1d1f;
		font-family: 'Inter Variable', sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.copy { position: absolute; left: 72px; top: 92px; width: 470px; }
	.brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
	.brand img { width: 64px; height: 64px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16)); }
	h1 { font-size: 66px; line-height: 1.04; font-weight: 640; letter-spacing: -0.035em; margin: 42px 0 20px; }
	p { font-size: 25px; line-height: 1.4; color: #62626b; margin: 0; }
	.shot {
		position: absolute;
		left: 600px;
		top: 86px;
		width: 760px;
		height: 600px;
		border-radius: 16px;
		overflow: hidden;
		border: 1px solid #e0e0e6;
		box-shadow: 0 30px 70px rgba(0, 0, 0, 0.16);
		background: #eeeef0;
	}
	.shot img { position: absolute; left: -238px; top: 0; width: 1280px; }
</style>
</head>
<body>
	<div class="copy">
		<div class="brand"><img src="../.build/icon-512.png" alt="">Paper</div>
		<h1>Sketch it, then design it.</h1>
		<p>A native canvas for the Mac, with your work saved on your computer.</p>
	</div>
	<div class="shot"><img src="../screenshots/out/app-light.png" alt=""></div>
</body>
</html>
